name: Build Twenty deployment image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: 2.56.0-915187c-r2
      platform:
        description: Target platform
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/arm64
  push:
    branches:
      - ci/build-custom-image

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: ${{ inputs.platform || 'linux/amd64' }}
          build-args: |
            APP_VERSION=v2.56.0
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/twenty:${{ inputs.tag || '2.56.0-915187c-r2' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
